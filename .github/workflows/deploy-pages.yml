name: Deploy Cafe Pachmarhi to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static site
        run: npm run build

      - name: Normalize Cafe Pachmarhi asset paths
        run: |
          if [ -d "out/cafe-pachmarhi" ]; then
            cp -a out/cafe-pachmarhi/. out/
          fi

      - name: Verify exported site and images
        run: |
          test -f out/index.html
          test -f out/hero.jpg
          test -f out/cafe-01.jpg
          test -f out/cafe-02.jpg
          test -f out/cafe-03.jpg
          test -f out/cafe-04.jpg
          test -f out/cafe-05.jpg
          test -f out/cafe-pachmarhi/hero.jpg
          test -f out/cafe-pachmarhi/cafe-01.jpg
          echo "Static export and Cafe Pachmarhi images verified."

      - name: Add nojekyll marker
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
